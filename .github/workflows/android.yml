name: Android verification

on:
  push:
    branches:
      - main
      - android/**
      - fix/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile, lint, and test
        run: ./gradlew --no-daemon --stacktrace :app:check :app:testDebugUnitTest :app:assembleDebug :app:lint
      - name: Verify generated Android version
        run: ./gradlew --no-daemon :app:printResolvedVersion
      - name: Verify exported Room schema v10
        run: |
          test -f app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/10.json
          grep -q '"version"[[:space:]]*:[[:space:]]*10' app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/10.json
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room migration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Verify debug APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-gallery-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
