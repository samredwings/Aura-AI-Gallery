name: Android verification

on:
  push:
    branches:
      - main
      - android/**
      - fix/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile, lint, and test
        run: ./gradlew --no-daemon --stacktrace :app:check :app:testDebugUnitTest
      - name: Verify generated Android version
        run: ./gradlew --no-daemon :app:printResolvedVersion
      - name: Verify exported Room schema v8
        run: |
          test -f app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/8.json
          grep -q '"version"[[:space:]]*:[[:space:]]*8' app/schemas/ai.sakana.aura.gallery.data.local.AuraGalleryDatabase/8.json
